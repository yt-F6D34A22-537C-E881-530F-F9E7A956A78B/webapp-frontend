<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>学びの棚 ｜ スクリーニング</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="../assets/favicon.ico">

  <!-- 既存アプリと同じデザイントークン（色・フォント・シャドウ等）を再利用する -->
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../css/style.css">
  <!-- 本ページ固有のレイアウトのみ、別ファイルへ分離する（style.css自体は変更しない） -->
  <link rel="stylesheet" href="../css/review.css">

  <script defer src="../js/review.js"></script>
</head>

<body>
  <div class="app-container">

    <header class="app-header">
      <h1>学びの棚</h1>
      <nav class="app-header-nav">
        <a href="../index.html">← スクリーニングへ戻る</a>
      </nav>
    </header>

    <!-- ============================
         表示モード切替（読む／しおり一覧／メモ一覧）
         スクリーニングページの .mode-tabs と同じ「非アクティブ＝フラット」
         デザインに合わせるため、.btn は使わず review.css で個別にスタイルする。
    ============================ -->
    <section class="card review-tabs-card">
      <nav class="review-tabs" role="tablist">
        <button id="reviewTabRead" class="review-tab-btn" data-current>読む</button>
        <button id="reviewTabBookmarks" class="review-tab-btn">しおり一覧</button>
        <button id="reviewTabMemos" class="review-tab-btn">メモ一覧</button>
      </nav>
    </section>

    <!-- ============================
         「読む」ビュー
    ============================ -->
    <div id="reviewViewRead" class="review-view">
      <div class="review-layout">

        <!-- 目次 -->
        <nav class="card review-toc-card">
          <h2>目次</h2>
          <div id="chapterNavEl"></div>
          <button id="addChapterBtn" class="btn secondary small review-add-chapter-btn">＋ 新規章を追加</button>
        </nav>

        <!-- 本文 -->
        <section id="reviewReaderSection" class="card review-reader-card">

          <div id="reviewLoadingOverlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>読み込み中…</p>
          </div>

          <div class="review-reader-head">
            <p id="chapterBreadcrumbEl" class="review-breadcrumb"></p>
            <div class="review-reader-headline">
              <h2 id="chapterTitleEl" class="review-chapter-title"></h2>
              <button id="editChapterBtn" class="btn ghost review-edit-btn" title="この章を編集">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M12 20h9"/>
                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                </svg>
              </button>
              <button id="bookmarkToggleBtn" class="btn ghost review-bookmark-btn" title="しおりを挟む">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M6 2h12v20l-6-4-6 4V2Z"/>
                </svg>
              </button>
            </div>
            <p id="chapterMetaEl" class="review-meta"></p>
          </div>

          <article id="chapterBodyEl" class="review-prose"></article>

          <div class="review-reader-foot">
            <button id="chapterPrevBtn" class="btn secondary small">← 前の章</button>
            <button id="chapterNextBtn" class="btn secondary small">次の章 →</button>
          </div>

          <div class="review-memo-block">
            <h3>この章のメモ</h3>
            <textarea id="memoTextareaEl" placeholder="気づいたことを書き留める…"></textarea>
            <div class="review-memo-actions">
              <button id="memoSaveBtn" class="btn primary small">メモを保存</button>
              <span id="memoStatusEl" class="review-memo-status" aria-live="polite"></span>
            </div>
          </div>

        </section>
      </div>
    </div>

    <!-- ============================
         章の追加・編集モーダル
         既存の .modal（style.css）と似た構造だが、チャートモーダル専用の
         id（#chartHeaderLeft 等）に依存させないため review 専用に組む。
    ============================ -->
    <div id="chapterEditorModal" class="review-editor-modal hidden">
      <div class="review-editor-backdrop"></div>
      <div class="review-editor-content">
        <div class="review-editor-header">
          <h2 id="chapterEditorTitleEl">新規章を追加</h2>
          <button id="chapterEditorCloseBtn" class="btn ghost small" title="閉じる">✕</button>
        </div>

        <div class="review-editor-body">
          <label class="review-editor-field">
            <span>グループ（第◯部のさらに上の階層）</span>
            <input id="chapterEditorGroupInput" type="text" list="chapterGroupOptions" placeholder="例：基礎編">
            <datalist id="chapterGroupOptions"></datalist>
          </label>

          <label class="review-editor-field">
            <span>部</span>
            <input id="chapterEditorPartInput" type="text" list="chapterPartOptions" placeholder="例：第1部　株式投資の基礎">
            <datalist id="chapterPartOptions"></datalist>
          </label>

          <label class="review-editor-field">
            <span>章タイトル</span>
            <input id="chapterEditorTitleInput" type="text" placeholder="例：第1章　株ってそもそも何？">
          </label>

          <label class="review-editor-field review-editor-field-narrow">
            <span>読了目安（分）</span>
            <input id="chapterEditorReadMinutesInput" type="number" min="1" value="3">
          </label>

          <div class="review-editor-field">
            <span>画像を挿入</span>
            <div id="chapterEditorImageDropzone" class="review-editor-image-dropzone" tabindex="0">
              画像ファイルをドラッグ&amp;ドロップ、クリックして選択、またはこの枠をクリックして<br>Ctrl+V（Macは⌘+V）でクリップボードから貼り付け
              <input id="chapterEditorImageFileInput" type="file" accept="image/*" class="review-editor-image-file-input">
            </div>
            <p id="chapterEditorImageStatusEl" class="review-editor-image-status" aria-live="polite"></p>
            <div id="chapterEditorImageResultWrap" class="review-editor-image-result hidden">
              <img id="chapterEditorImagePreview" class="review-editor-image-preview" alt="">
              <div class="review-editor-image-tag-row">
                <textarea id="chapterEditorImageTagOutput" rows="2" readonly></textarea>
                <button id="chapterEditorImageCopyBtn" type="button" class="btn ghost small review-editor-image-copy-btn" title="imgタグをコピー">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                       fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <label class="review-editor-field">
            <span>本文（HTML）</span>
            <textarea id="chapterEditorBodyHtmlInput" rows="8" placeholder="&lt;p&gt;本文…&lt;/p&gt;"></textarea>
          </label>

          <div class="review-editor-field">
            <span>プレビュー</span>
            <div id="chapterEditorPreviewEl" class="review-prose review-editor-preview"></div>
          </div>
        </div>

        <div class="review-editor-footer">
          <button id="chapterEditorDeleteBtn" class="btn ghost review-editor-delete-btn hidden">この章を削除</button>
          <div class="review-editor-footer-right">
            <button id="chapterEditorCancelBtn" class="btn secondary">キャンセル</button>
            <button id="chapterEditorSaveBtn" class="btn primary">保存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================
         「しおり一覧」ビュー
    ============================ -->
    <div id="reviewViewBookmarks" class="review-view hidden">
      <section class="card review-bookmarks-card">
        <h2>しおり一覧</h2>
        <p class="hint">しおりを挟んだ章の一覧です。タップするとその章を開きます。</p>
        <div id="bookmarkListEl"></div>
        <p id="bookmarkEmptyEl" class="review-bookmark-empty hidden">まだしおりはありません。「読む」タブで気になる章にしおりを挟んでみましょう。</p>
      </section>
    </div>

    <!-- ============================
         「メモ一覧」ビュー
    ============================ -->
    <div id="reviewViewMemos" class="review-view hidden">
      <section class="card review-memos-card">
        <h2>メモ一覧</h2>
        <p class="hint">メモを書き込んだ章の一覧です。タップするとその章を開きます。</p>
        <div id="memoListEl"></div>
        <p id="memoListEmptyEl" class="review-bookmark-empty hidden">まだメモはありません。「読む」タブで気づいたことを書き留めてみましょう。</p>
      </section>
    </div>

  </div>
</body>
</html>
